
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الحواس الخمس</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --background: #F7FFF7;
            --text-color: #2C3E50;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--background);
            color: var(--text-color);
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #game-container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
            min-height: 600px;
            display: flex;
            flex-direction: column;
        }

        .screen {
            display: none;
            flex: 1;
            padding: 40px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1, h2, h3 {
            color: var(--primary);
            text-shadow: 2px 2px 0px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .btn {
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 5px 15px rgba(78, 205, 196, 0.4);
            margin-top: 20px;
        }

        .btn:hover {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 8px 25px rgba(78, 205, 196, 0.6);
        }
        
        .btn:active {
            transform: scale(0.95);
        }

        .btn-primary {
            background-color: var(--primary);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }
        
        .btn-primary:hover {
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.6);
        }

        input[type="text"] {
            padding: 15px 25px;
            font-size: 1.5rem;
            border: 3px solid #eee;
            border-radius: 20px;
            text-align: center;
            font-family: 'Cairo', sans-serif;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.3s;
            width: 80%;
            max-width: 400px;
        }

        input[type="text"]:focus {
            border-color: var(--secondary);
        }

        /* --- Animation Stage CSS (Video-like Styles) --- */
        .animation-stage {
            width: 100%;
            max-width: 600px;
            height: 300px;
            margin: 0 auto 30px;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            border-radius: 30px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 20px rgba(255,255,255,0.6), 0 15px 30px rgba(0,0,0,0.15);
            border: 8px solid white;
        }

        .stage-scenery {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .sun {
            position: absolute;
            top: 20px; right: 30px;
            width: 50px; height: 50px;
            background: #FFD700;
            border-radius: 50%;
            box-shadow: 0 0 30px #FFD700;
            animation: pulseSun 3s infinite alternate;
        }
        @keyframes pulseSun {
            from { transform: scale(1); box-shadow: 0 0 20px #FFD700; }
            to { transform: scale(1.2); box-shadow: 0 0 40px #FFD700; }
        }

        .cloud {
            position: absolute;
            background: white;
            border-radius: 50px;
            animation: floatCloud linear infinite;
            opacity: 0.9;
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 50%;
        }
        .cloud1 { width: 100px; height: 30px; top: 40px; left: -120px; animation-duration: 25s; }
        .cloud1::before { width: 50px; height: 50px; top: -20px; left: 15px; }
        .cloud1::after { width: 40px; height: 40px; top: -10px; right: 15px; }
        .cloud2 { width: 80px; height: 25px; top: 90px; left: -150px; animation-duration: 35s; animation-delay: 5s; transform: scale(0.8); }
        .cloud2::before { width: 40px; height: 40px; top: -15px; left: 10px; }
        .cloud2::after { width: 30px; height: 30px; top: -5px; right: 10px; }

        @keyframes floatCloud {
            from { transform: translateX(-150px); }
            to { transform: translateX(800px); }
        }

        .hill-back {
            position: absolute;
            bottom: -50px; left: -10%;
            width: 120%; height: 150px;
            background: #81C784;
            border-radius: 50%;
            z-index: 1;
        }
        .hill-front {
            position: absolute;
            bottom: -70px; right: -10%;
            width: 120%; height: 160px;
            background: #AED581;
            border-radius: 50%;
            z-index: 2;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.05);
        }

        .scene-content {
            position: absolute;
            inset: 0;
            z-index: 10;
        }
        
        .scene-content > div > div {
            filter: drop-shadow(2px 5px 4px rgba(0,0,0,0.3));
        }

        /* --- Specific Animations for Senses --- */
        
        /* 1. Sight */
        .scene-sight .char-face { font-size: 6rem; position: absolute; bottom: 15px; left: 50px; z-index: 10; }
        .tracking-eyes { animation: trackEyes 3s infinite alternate ease-in-out; }
        @keyframes trackEyes { 0% { transform: rotate(-15deg); } 100% { transform: rotate(15deg); } }
        .scene-sight .flying-prop { font-size: 4rem; position: absolute; z-index: 11; animation: flyPath 6s infinite linear; }
        @keyframes flyPath {
            0% { transform: translate(600px, 40px) rotate(-10deg); }
            25% { transform: translate(400px, 90px) rotate(20deg); }
            50% { transform: translate(250px, 20px) rotate(-20deg); }
            75% { transform: translate(100px, 70px) rotate(10deg); }
            100% { transform: translate(-100px, 10px) rotate(0deg); }
        }

        /* 2. Hearing */
        .scene-hearing .char-face { font-size: 6rem; position: absolute; bottom: 15px; left: 80px; z-index: 10; }
        .bopping { animation: bop 0.6s infinite alternate ease-in-out; }
        @keyframes bop { 0% { transform: rotate(-5deg) translateY(0); } 100% { transform: rotate(5deg) translateY(-15px); } }
        .scene-hearing .radio-prop { font-size: 5rem; position: absolute; bottom: 15px; right: 80px; z-index: 10; animation: vibrate 0.2s infinite; }
        @keyframes vibrate { 0% { transform: translate(0, 0); } 25% { transform: translate(-2px, 2px); } 50% { transform: translate(2px, -2px); } 75% { transform: translate(-2px, -2px); } 100% { transform: translate(2px, 2px); } }
        .scene-hearing .note { position: absolute; font-size: 2.5rem; bottom: 80px; right: 100px; z-index: 11; opacity: 0; animation: floatNote 2s infinite ease-out; }
        .scene-hearing .n1 { animation-delay: 0s; right: 100px; }
        .scene-hearing .n2 { animation-delay: 0.7s; right: 130px; }
        .scene-hearing .n3 { animation-delay: 1.4s; right: 90px; }
        @keyframes floatNote { 0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-140px) scale(1.3) rotate(30deg); opacity: 0; } }

        /* 3. Smell */
        .scene-smell .char-face { font-size: 6rem; position: absolute; bottom: 15px; left: 60px; z-index: 10; }
        .sniffing { animation: sniff 2.5s infinite ease-in-out; }
        @keyframes sniff { 0%, 100% { transform: scale(1) translateY(0); } 50% { transform: scale(1.05) translateY(-10px) rotate(5deg); } }
        .scene-smell .flower-prop { font-size: 6rem; position: absolute; bottom: 10px; right: 60px; z-index: 10; transform-origin: bottom center; animation: sway 3s infinite alternate ease-in-out; }
        @keyframes sway { 0% { transform: rotate(-8deg); } 100% { transform: rotate(8deg); } }
        .scene-smell .wave { position: absolute; bottom: 80px; right: 120px; font-size: 2.5rem; z-index: 11; opacity: 0; color: #ff69b4; font-weight: bold; animation: floatScent 2.5s infinite ease-in-out; }
        .scene-smell .w1 { animation-delay: 0s; }
        .scene-smell .w2 { animation-delay: 1.2s; right: 140px; bottom: 60px;}
        @keyframes floatScent { 0% { transform: translate(0, 0) scale(0.5); opacity: 0; } 30% { opacity: 0.9; } 100% { transform: translate(-180px, -40px) scale(1.5); opacity: 0; } }

        /* 4. Taste */
        .scene-taste .char-face { font-size: 6rem; position: absolute; bottom: 15px; left: 250px; z-index: 10; }
        .eating { animation: chew 1s infinite alternate; }
        @keyframes chew { 0% { transform: scale(1); } 100% { transform: scale(1.1) translateY(-8px); } }
        .scene-taste .food-prop { font-size: 4.5rem; position: absolute; bottom: 25px; right: 40px; z-index: 11; animation: feed 2.5s infinite; }
        @keyframes feed { 
            0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
            40%, 60% { transform: translate(-140px, -20px) rotate(-20deg); opacity: 1; }
            70%, 100% { transform: translate(-140px, -20px) rotate(-20deg); opacity: 0; }
        }

        /* 5. Touch */
        .scene-touch .pet-prop { font-size: 6rem; position: absolute; bottom: 15px; left: 180px; z-index: 10; animation: purr 0.5s infinite alternate; }
        @keyframes purr { 0% { transform: scaleY(1); } 100% { transform: scaleY(0.95); } }
        .scene-touch .hand-prop { font-size: 5.5rem; position: absolute; bottom: 80px; left: 320px; z-index: 11; transform-origin: bottom right; animation: pet 1.5s infinite ease-in-out; }
        @keyframes pet { 0%, 100% { transform: translate(0, 0) rotate(15deg); } 50% { transform: translate(-110px, 30px) rotate(-10deg); } }
        .scene-touch .heart { position: absolute; font-size: 2.5rem; bottom: 100px; left: 200px; z-index: 12; opacity: 0; animation: floatHeart 1.5s infinite ease-out; }
        .scene-touch .h1 { animation-delay: 0s; left: 180px; }
        .scene-touch .h2 { animation-delay: 0.7s; left: 230px; }
        @keyframes floatHeart { 0% { transform: translateY(0) scale(0.5); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-100px) scale(1.2); opacity: 0; } }

        /* ------------------------------------- */

        .sense-description {
            font-size: 1.5rem;
            line-height: 1.8;
            color: #555;
            background: #f9f9f9;
            padding: 20px;
            border-radius: 20px;
            border-right: 5px solid var(--secondary);
            width: 100%;
        }

        .game-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            width: 100%;
            margin-top: 20px;
        }

        .organs, .senses-targets {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .draggable {
            background: white;
            border: 3px dashed var(--primary);
            border-radius: 15px;
            padding: 15px;
            font-size: 3rem;
            cursor: grab;
            user-select: none;
            transition: transform 0.2s;
            touch-action: none;
        }
        
        .draggable:active {
            cursor: grabbing;
            transform: scale(1.1);
        }

        .dropzone {
            background: #f0f0f0;
            border: 3px solid #ccc;
            border-radius: 15px;
            padding: 15px;
            min-height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            font-weight: bold;
            transition: all 0.3s;
        }

        .dropzone.dragover {
            background: var(--accent);
            border-color: var(--secondary);
            transform: scale(1.02);
        }
        
        .dropzone.correct {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
            animation: pulseCorrect 0.5s;
        }
        
        @keyframes pulseCorrect { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        .certificate {
            background: linear-gradient(135deg, #fff 0%, #f0f9ff 100%);
            border: 15px solid var(--accent);
            border-radius: 20px;
            padding: 40px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        
        .certificate::before {
            content: '';
            position: absolute;
            top: 5px; left: 5px; right: 5px; bottom: 5px;
            border: 2px dashed var(--secondary);
            border-radius: 10px;
            pointer-events: none;
        }

        .ribbon {
            width: 100px;
            height: 100px;
            background: var(--primary);
            border-radius: 50%;
            position: absolute;
            top: -30px;
            right: -30px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .cert-title { font-size: 2.5rem; color: #d35400; margin-bottom: 20px; }
        .cert-text { font-size: 1.5rem; margin: 15px 0; }
        
        .student-name {
            font-size: 3rem;
            color: var(--primary);
            font-weight: 900;
            border-bottom: 3px solid var(--primary);
            display: inline-block;
            padding: 0 20px;
            margin: 10px 0;
        }

        .cert-footer { margin-top: 40px; font-size: 1.2rem; font-weight: bold; color: #7f8c8d; }
        .confetti { position: absolute; width: 10px; height: 10px; background-color: #f00; z-index: 10; }
        
        #message-box {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 15px 30px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            font-weight: bold;
            font-size: 1.2rem;
            z-index: 1000;
            transition: top 0.3s, opacity 0.3s;
            opacity: 0;
            pointer-events: none;
        }
        
        #message-box.show { top: 50px; opacity: 1; }
    </style>
</head>
<body>

    <div id="message-box"></div>

    <div id="game-container">
        <div id="screen-welcome" class="screen active">
            <h1 class="text-5xl font-black mb-4">مرحباً بك في عالم الحواس!</h1>
            <p class="text-2xl mb-8">دعنا نكتشف كيف نشعر بالعالم من حولنا.</p>
            
            <div class="text-6xl mb-8 animate-bounce">
                👀 👃 👅 👂 ✋
            </div>

            <h2 class="text-3xl">ما هو اسمك يا بطل؟</h2>
            <input type="text" id="player-name" placeholder="اكتب اسمك هنا..." autocomplete="off">
            <button class="btn btn-primary" onclick="startGame()">ابدأ المغامرة!</button>
        </div>

        <div id="screen-learn" class="screen">
            <h2 class="text-4xl font-black" id="learn-title"></h2>
            
            <!-- Video-Like Animation Stage -->
            <div class="animation-stage">
                <div class="stage-scenery">
                    <div class="sun"></div>
                    <div class="cloud cloud1"></div>
                    <div class="cloud cloud2"></div>
                    <div class="hill-back"></div>
                    <div class="hill-front"></div>
                </div>
                <!-- Dynamic scene content injected here -->
                <div id="animation-stage-content" class="scene-content"></div>
            </div>
            
            <p class="sense-description" id="learn-desc"></p>
            
            <div class="flex gap-4">
                <button class="btn" id="btn-next-sense" onclick="nextSense()">التالي</button>
            </div>
            
            <div class="mt-8 flex gap-2" id="progress-dots">
                <!-- Dots added via JS -->
            </div>
        </div>

        <div id="screen-activity" class="screen">
            <h2 class="text-4xl mb-2">وقت اللعب!</h2>
            <p class="text-xl mb-6">اسحب كل عضو إلى الحاسة التي يقوم بها</p>
            
            <div class="game-grid">
                <div class="organs" id="draggable-container">
                    <!-- Draggables added via JS -->
                </div>
                <div class="senses-targets" id="dropzone-container">
                    <!-- Dropzones added via JS -->
                </div>
            </div>
        </div>

        <div id="screen-certificate" class="screen">
            <div class="certificate w-full">
                <div class="ribbon">🌟</div>
                <h1 class="cert-title">شهادة تفوق</h1>
                <p class="cert-text">تُمنح هذه الشهادة للبطل الذكي</p>
                <div class="student-name" id="cert-name">اسم الطفل</div>
                <p class="cert-text">لاجتيازه مغامرة الحواس الخمس بنجاح وتميز!</p>
                
                <div class="flex justify-between items-center cert-footer">
                    <div>
                        <p>مقدمة من:</p>
                        <h3 class="text-2xl text-blue-600 m-0">MAYA NOVA</h3>
                    </div>
                    <div>
                        <div class="text-4xl">🏆</div>
                    </div>
                </div>
            </div>
            <button class="btn mt-8" onclick="location.reload()">العب مرة أخرى</button>
        </div>
    </div>

    <script>
        // Data for senses with Custom Animated Scenes
        const sensesData = [
            { 
                id: 'sight', 
                name: 'حاسة البصر', 
                icon: '👁️', 
                organ: 'العين', 
                desc: 'انظر كيف يراقب الطفل الفراشة الجميلة وهي تطير! نحن نستخدم عيوننا لنرى الألوان والأشياء التي تتحرك من حولنا.',
                animationHtml: `
                    <div class="scene-sight">
                        <div class="char-face tracking-eyes">👦</div>
                        <div class="flying-prop">🦋</div>
                    </div>
                `
            },
            { 
                id: 'hearing', 
                name: 'حاسة السمع', 
                icon: '👂', 
                organ: 'الأذن', 
                desc: 'شاهد كيف تستمتع الفتاة بسماع الموسيقى من الراديو! نحن نستخدم آذاننا لنسمع الألحان والأصوات المختلفة.',
                animationHtml: `
                    <div class="scene-hearing">
                        <div class="char-face bopping">👧</div>
                        <div class="radio-prop">📻</div>
                        <div class="note n1">🎵</div>
                        <div class="note n2">🎶</div>
                        <div class="note n3">🎵</div>
                    </div>
                `
            },
            { 
                id: 'smell', 
                name: 'حاسة الشم', 
                icon: '👃', 
                organ: 'الأنف', 
                desc: 'امممم.. رائحة هذه الزهرة عطرة جداً! نحن نستخدم أنفنا لنشم الروائح الجميلة والطعام اللذيذ.',
                animationHtml: `
                    <div class="scene-smell">
                        <div class="char-face sniffing">👦</div>
                        <div class="flower-prop">🌻</div>
                        <div class="wave w1">〰️</div>
                        <div class="wave w2">〰️</div>
                    </div>
                `
            },
            { 
                id: 'taste', 
                name: 'حاسة التذوق', 
                icon: '👅', 
                organ: 'اللسان', 
                desc: 'يممي! البطيخ طعمه رائع وحلو. نحن نستخدم لساننا لنتذوق الأطعمة الحلوة والمالحة.',
                animationHtml: `
                    <div class="scene-taste">
                        <div class="char-face eating">😋</div>
                        <div class="food-prop">🍉</div>
                    </div>
                `
            },
            { 
                id: 'touch', 
                name: 'حاسة اللمس', 
                icon: '✋', 
                organ: 'اليد/الجلد', 
                desc: 'انظر كم القطة ناعمة ولطيفة! نحن نستخدم أيدينا وجلدنا لنشعر بالأشياء الناعمة والدافئة.',
                animationHtml: `
                    <div class="scene-touch">
                        <div class="pet-prop">🐈</div>
                        <div class="hand-prop">🤚</div>
                        <div class="heart h1">❤️</div>
                        <div class="heart h2">❤️</div>
                    </div>
                `
            }
        ];

        let currentSenseIndex = 0;
        let playerName = "";
        let correctMatches = 0;

        function showMessage(msg, isSuccess = false) {
            const msgBox = document.getElementById('message-box');
            msgBox.textContent = msg;
            msgBox.style.color = isSuccess ? '#155724' : '#721c24';
            msgBox.style.backgroundColor = isSuccess ? '#d4edda' : '#f8d7da';
            msgBox.style.border = `2px solid ${isSuccess ? '#c3e6cb' : '#f5c6cb'}`;
            msgBox.classList.add('show');
            setTimeout(() => msgBox.classList.remove('show'), 3000);
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function startGame() {
            const nameInput = document.getElementById('player-name').value.trim();
            if (nameInput === "") {
                showMessage("من فضلك، اكتب اسمك أولاً لنبدأ!");
                return;
            }
            playerName = nameInput;
            setupProgressDots();
            loadSense();
            showScreen('screen-learn');
        }

        function setupProgressDots() {
            const container = document.getElementById('progress-dots');
            container.innerHTML = '';
            sensesData.forEach((_, index) => {
                const dot = document.createElement('div');
                dot.className = `w-4 h-4 rounded-full ${index === 0 ? 'bg-secondary' : 'bg-gray-300'}`;
                dot.id = `dot-${index}`;
                container.appendChild(dot);
            });
        }

        function updateProgressDots() {
            sensesData.forEach((_, index) => {
                const dot = document.getElementById(`dot-${index}`);
                if(dot) {
                    dot.className = `w-4 h-4 rounded-full ${index <= currentSenseIndex ? 'bg-secondary' : 'bg-gray-300'} transition-colors duration-300`;
                }
            });
        }

        function loadSense() {
            const sense = sensesData[currentSenseIndex];
            document.getElementById('learn-title').textContent = sense.name;
            
            // Inject Animation Scene
            document.getElementById('animation-stage-content').innerHTML = sense.animationHtml;
            
            // Personalize description
            const desc = document.getElementById('learn-desc');
            desc.innerHTML = `يا <strong class="text-primary">${playerName}</strong>، ${sense.desc}`;
            
            const btnNext = document.getElementById('btn-next-sense');
            if (currentSenseIndex === sensesData.length - 1) {
                btnNext.textContent = "هيا نلعب!";
                btnNext.classList.add('btn-primary');
            } else {
                btnNext.textContent = "التالي";
                btnNext.classList.remove('btn-primary');
            }
            updateProgressDots();
        }

        function nextSense() {
            if (currentSenseIndex < sensesData.length - 1) {
                currentSenseIndex++;
                const learnScreen = document.getElementById('screen-learn');
                learnScreen.style.animation = 'none';
                learnScreen.offsetHeight; 
                learnScreen.style.animation = null;
                loadSense();
            } else {
                setupActivity();
                showScreen('screen-activity');
            }
        }

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function setupActivity() {
            const draggablesContainer = document.getElementById('draggable-container');
            const dropzoneContainer = document.getElementById('dropzone-container');
            
            draggablesContainer.innerHTML = '';
            dropzoneContainer.innerHTML = '';
            correctMatches = 0;

            let shuffledIcons = shuffle([...sensesData]);
            shuffledIcons.forEach(sense => {
                const el = document.createElement('div');
                el.className = 'draggable';
                el.draggable = true;
                el.textContent = sense.icon;
                el.dataset.id = sense.id;
                
                el.addEventListener('dragstart', handleDragStart);
                el.addEventListener('dragend', handleDragEnd);
                el.addEventListener('touchstart', handleTouchStart, {passive: false});
                el.addEventListener('touchmove', handleTouchMove, {passive: false});
                el.addEventListener('touchend', handleTouchEnd);
                
                draggablesContainer.appendChild(el);
            });

            let shuffledNames = shuffle([...sensesData]);
            shuffledNames.forEach(sense => {
                const el = document.createElement('div');
                el.className = 'dropzone';
                el.textContent = sense.name;
                el.dataset.id = sense.id;
                
                el.addEventListener('dragover', handleDragOver);
                el.addEventListener('dragleave', handleDragLeave);
                el.addEventListener('drop', handleDrop);
                
                dropzoneContainer.appendChild(el);
            });
        }

        let draggedItem = null;
        function handleDragStart(e) { draggedItem = this; setTimeout(() => this.style.opacity = '0.5', 0); }
        function handleDragEnd() { setTimeout(() => this.style.opacity = '1', 0); draggedItem = null; }
        function handleDragOver(e) { e.preventDefault(); if(!this.classList.contains('correct')) this.classList.add('dragover'); }
        function handleDragLeave() { this.classList.remove('dragover'); }
        function handleDrop(e) { e.preventDefault(); this.classList.remove('dragover'); checkMatch(draggedItem, this); }

        let touchTarget = null;
        let startX, startY, initialX, initialY;

        function handleTouchStart(e) {
            draggedItem = this;
            const touch = e.touches[0];
            startX = touch.clientX; startY = touch.clientY;
            const rect = this.getBoundingClientRect();
            initialX = rect.left; initialY = rect.top;

            this.style.position = 'fixed';
            this.style.zIndex = '1000';
            this.style.left = initialX + 'px';
            this.style.top = initialY + 'px';
            this.style.opacity = '0.8';
        }

        function handleTouchMove(e) {
            if (!draggedItem) return;
            e.preventDefault(); 
            
            const touch = e.touches[0];
            const dx = touch.clientX - startX;
            const dy = touch.clientY - startY;
            
            draggedItem.style.left = (initialX + dx) + 'px';
            draggedItem.style.top = (initialY + dy) + 'px';
            
            const dropzones = document.querySelectorAll('.dropzone');
            dropzones.forEach(zone => zone.classList.remove('dragover'));
            
            touchTarget = document.elementFromPoint(touch.clientX, touch.clientY);
            if (touchTarget && touchTarget.classList.contains('dropzone') && !touchTarget.classList.contains('correct')) {
                touchTarget.classList.add('dragover');
            } else {
                touchTarget = null;
            }
        }

        function handleTouchEnd(e) {
            if (!draggedItem) return;
            
            draggedItem.style.position = '';
            draggedItem.style.zIndex = '';
            draggedItem.style.left = '';
            draggedItem.style.top = '';
            draggedItem.style.opacity = '1';
            
            const dropzones = document.querySelectorAll('.dropzone');
            dropzones.forEach(zone => zone.classList.remove('dragover'));

            if (touchTarget && touchTarget.classList.contains('dropzone')) {
                 checkMatch(draggedItem, touchTarget);
            }
            
            draggedItem = null; touchTarget = null;
        }

        function checkMatch(dragElement, dropElement) {
            if (!dragElement || !dropElement) return;

            if (dragElement.dataset.id === dropElement.dataset.id) {
                dropElement.classList.add('correct');
                dropElement.innerHTML = `${dropElement.textContent} ${dragElement.textContent}`;
                dragElement.style.visibility = 'hidden'; 
                
                correctMatches++;
                showMessage("أحسنت! إجابة صحيحة.", true);

                if (correctMatches === sensesData.length) {
                    setTimeout(showCertificate, 1000);
                }
            } else {
                showMessage("حاول مرة أخرى!");
                dropElement.style.transform = 'translateX(-10px)';
                setTimeout(() => dropElement.style.transform = 'translateX(10px)', 100);
                setTimeout(() => dropElement.style.transform = 'translateX(-10px)', 200);
                setTimeout(() => dropElement.style.transform = 'translateX(0)', 300);
            }
        }

        function showCertificate() {
            document.getElementById('cert-name').textContent = playerName;
            showScreen('screen-certificate');
            createConfetti();
        }

        function createConfetti() {
            const colors = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#45B7D1', '#96CEB4'];
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.top = '-10px';
                
                const duration = Math.random() * 3000 + 2000;
                confetti.animate([
                    { transform: 'translate3d(0,0,0) rotateX(0) rotateY(0)' },
                    { transform: `translate3d(${Math.random()*200 - 100}px, 100vh, 0) rotateX(${Math.random()*360}deg) rotateY(${Math.random()*360}deg)` }
                ], { duration: duration, iterations: 1, easing: 'cubic-bezier(.37,0,.63,1)', fill: 'forwards' });

                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), duration);
            }
        }
    </script>
